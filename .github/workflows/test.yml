name: Cross-platform tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: python -m pip install ./resources/python ./resources/gateway
      - run: python -m unittest discover -s resources/python/tests -v
      - run: python -m unittest discover -s resources/gateway/tests -v
      - run: node test/runtime-smoke.mjs
