[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adverserial-confidential-gateway"
version = "0.1.0"
description = "Loopback-only confidential gateway for Adverserial OpenAI-compatible inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["adverserial>=0.1.0"]

[project.scripts]
adverserial-confidential-gateway = "adverserial_gateway.server:main"

[tool.setuptools.packages.find]
include = ["adverserial_gateway*"]
